name: ✅ CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            activity/package-lock.json

      - run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Activity Discord (typecheck & build)
        run: npm --prefix activity ci && npm --prefix activity run build
